events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 🔒 SEGURIDAD: Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;

    # ⏱️ Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 20M;

    upstream backend {
        server backend:3001;
    }

    server {
        listen 80;
        server_name ${NGINX_DOMAIN} www.${NGINX_DOMAIN};

        # 🔒 BLOQUEAR ARCHIVOS SENSIBLES
        location ~ /\.(env|git|ht|aws|config) {
            deny all;
            return 404;
        }

        location ~* (wp-admin|phpmyadmin|backup|sql) {
            deny all;
            return 404;
        }

        # 🔒 BLOQUEAR USER AGENTS MALICIOSOS
        if ($http_user_agent ~* (wget|curl|nikto|sqlmap|nmap|nessus|acunetix|scanbot)) {
            return 403;
        }

        # 🚀 TODAS LAS APIS UNIFICADAS BAJO /api/
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # 🔒 Rate limiting
            limit_req zone=api burst=20 nodelay;
        }

        # 🚀 NOTIFICACIONES SSE - ESPECIAL
        location /api/notifications/ {
            proxy_pass http://backend/api/notifications/;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # 📁 UPLOADS
        location /uploads/ {
            proxy_pass http://backend/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=general burst=10 nodelay;
        }

        # 🎯 CONFIGURACIÓN ESPECÍFICA PARA SPA (REACT/VUE)
        # Servir archivos estáticos con cache agresivo
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ✅ CONFIGURACIÓN CRÍTICA PARA SPA:
        # Todas las demás rutas deben servir index.html para que React maneje el routing
        location / {
            root /usr/share/nginx/html;
            # 🔑 IMPORTANTE: Usar try_files para servir index.html
            try_files $uri $uri/ /index.html;
            
            # Headers para evitar cache en el HTML principal
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # 🔧 MANEJO DE ERRORES - Redirigir todo a index.html para SPA
        error_page 404 =200 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}