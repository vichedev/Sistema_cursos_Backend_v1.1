events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 🔒 SEGURIDAD: Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;

    # ⏱️ Timeouts globales
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    client_max_body_size  20M;

    upstream backend {
        server backend:3001;
    }

    server {
        listen 80;
        server_name ${NGINX_DOMAIN} www.${NGINX_DOMAIN};

        # 🔒 BLOQUEAR ARCHIVOS SENSIBLES
        location ~ /\.(env|git|ht|aws|config) {
            deny all;
            return 404;
        }

        location ~* (wp-admin|phpmyadmin|backup|sql) {
            deny all;
            return 404;
        }

        # 🔒 BLOQUEAR USER AGENTS MALICIOSOS
        if ($http_user_agent ~* (wget|curl|nikto|sqlmap|nmap|nessus|acunetix|scanbot)) {
            return 403;
        }

        # Servir archivos estáticos del frontend
        location / {
            root  /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            limit_req zone=general burst=10 nodelay;
        }

        # ✅ DIPLOMAS PDF — timeout extendido porque Puppeteer tarda varios segundos
        # IMPORTANTE: debe ir ANTES del bloque genérico /api/ para que nginx lo tome
        location /api/diplomas/pdf/ {
            proxy_pass http://backend/api/diplomas/pdf/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ✅ 120s — suficiente para que Puppeteer genere el PDF sin que nginx corte
            proxy_connect_timeout 120s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            # Sin rate limiting para este endpoint (es una descarga, no una API)
        }

        # 🚀 TODAS LAS APIS UNIFICADAS BAJO /api/
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        'upgrade';
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # 🔒 Rate limiting
            limit_req zone=api burst=20 nodelay;
        }

        # 🚀 NOTIFICACIONES SSE — conexión larga especial
        location /api/notifications/ {
            proxy_pass http://backend/api/notifications/;
            proxy_http_version 1.1;
            proxy_set_header Connection        '';
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 24h;
        }

        # 📁 UPLOADS
        location /uploads/ {
            proxy_pass http://backend/uploads/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=general burst=10 nodelay;
        }
    }
}