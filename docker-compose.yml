version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cursos_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      TZ: America/Guayaquil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cursos_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: cursos_backend
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads:rw
      - ./public:/app/public:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cursos_network
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - NODE_ENV=production
      - TZ=America/Guayaquil

  nginx:
    image: nginx:alpine
    container_name: cursos_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-complete.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - cursos_network
    restart: unless-stopped
    environment:
      - NGINX_DOMAIN=${NGINX_DOMAIN}
      - TZ=America/Guayaquil

volumes:
  postgres_data:

networks:
  cursos_network:
    driver: bridge